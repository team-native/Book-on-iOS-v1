name: CI

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Cache Tuist
        uses: actions/cache@v4
        with:
          path: ~/.tuist/Cache
          key: ${{ runner.os }}-tuist-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Install dependencies
        run: tuist install

      - name: Generate project
        run: tuist generate --no-open

      - name: SwiftLint
        run: swiftlint lint --strict --baseline .swiftlint-baseline.json

      - name: Build app
        run: |
          xcodebuild build \
            -workspace Book-on-iOS-V1.xcworkspace \
            -scheme Book-on-iOS-V1 \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Test
        run: |
          xcodebuild test \
            -workspace Book-on-iOS-V1.xcworkspace \
            -scheme Service \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Test push notification routing
        run: |
          xcodebuild test \
            -workspace Book-on-iOS-V1.xcworkspace \
            -scheme Feature \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Test app UI
        run: |
          xcodebuild test \
            -workspace Book-on-iOS-V1.xcworkspace \
            -scheme Book-on-iOS-V1-UI \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
